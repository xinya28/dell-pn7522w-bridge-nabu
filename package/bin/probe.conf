# 采样点：每个内核构建都不一样。
#
# control.sh 用这些值生成 kprobe 事件，check.sh 用它确认驱动已加载。
# 适配新机型/新内核时只需改这个文件（以及必要时 src/dell_pen_bridge.c 里的字节语义）。
#
# 下面的值来自 liuqin（小米平板 6 Pro，内核 5.10.237-Fuutao，nt36532_touch.ko）。
# 小米平板 5（nabu）+ 水龙内核的值见 docs/NABU_PORT.md，尚未填写。

# 触控驱动在 /proc/modules 里的模块名。
PROBE_MODULE=nt36532_touch

# 笔数据被解析的函数；$ 后面是编译器给静态符号加的后缀，必须与 kallsyms 完全一致。
PROBE_SYMBOL='nvt_ts_work_func$5ae3b2be10c8de59fcf1b76a64203422'

# 函数内偏移：kprobe 的挂载点。
PROBE_OFFSET=0x7fc

# 笔帧各字节相对于被探测栈帧的偏移。
PROBE_B66=+210
PROBE_B71=+215
PROBE_B72=+216
PROBE_B75=+219
PROBE_B76=+220
PROBE_B77=+221

# 只让有效笔帧进入 trace，减少开销。
PROBE_FILTER='b66 == 1 || b66 == 255'
