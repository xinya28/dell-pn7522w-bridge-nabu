# 采样点：每个内核构建都不一样。
#
# control.sh 用这些值生成 kprobe 事件，check.sh 用它确认驱动已加载。
# 留空 PROBE_MODULE 表示这台机器没有可用的采样点：模块只启用顶部蓝牙键，
# 侧键桥接不启动。
#
# nabu（小米平板 5）实机结论见 docs/NABU_PORT.md：内核 4.14.180-moon-os3 关了
# CONFIG_KPROBES，且触控驱动不上报 BTN_STYLUS/BTN_STYLUS2，所以这里留空。
#
# liuqin（小米平板 6 Pro，nt36532_touch.ko，内核 5.10.237-Fuutao）的参考值：
#   PROBE_MODULE=nt36532_touch
#   PROBE_SYMBOL='nvt_ts_work_func$5ae3b2be10c8de59fcf1b76a64203422'
#   PROBE_OFFSET=0x7fc
#   PROBE_B66=+210
#   PROBE_B71=+215
#   PROBE_B72=+216
#   PROBE_B75=+219
#   PROBE_B76=+220
#   PROBE_B77=+221
#   PROBE_FILTER='b66 == 1 || b66 == 255'

PROBE_MODULE=
PROBE_SYMBOL=''
PROBE_OFFSET=0x0
PROBE_B66=+0
PROBE_B71=+0
PROBE_B72=+0
PROBE_B75=+0
PROBE_B76=+0
PROBE_B77=+0
PROBE_FILTER='b66 == 1 || b66 == 255'
